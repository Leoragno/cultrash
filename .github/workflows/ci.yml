name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test delle funzioni pure del gioco
        run: npm test

      - name: Build di produzione
        run: npm run build

      - name: Il server serve la build senza errori
        run: |
          node server/index.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:8787/api/salute
          curl -sf -o /dev/null http://localhost:8787/
          kill $SERVER_PID
